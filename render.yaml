# Render Blueprint: one free web service running API + web app + Telegram bot.
services:
  - type: web
    name: bloodlink
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt -r bot/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: NODE_VERSION
        value: 22.12.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BLOODLINK_WEB_URL
        sync: false
      - key: AUTO_SEED
        value: "1"
      - key: ADMIN_PASSWORD # admin portal sign-in (choose a long random password)
        sync: false
      - key: ADMIN_TELEGRAM_IDS # optional: comma-separated Telegram user ids that are admins
        sync: false
      - key: VAPID_PUBLIC_KEY # optional: browser push notifications (python backend/make_vapid_keys.py)
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: DEMO_LOGIN # 1 = demo accounts can be opened by code; set 0 for real-world use
        value: "1"
